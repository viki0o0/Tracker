<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Priority Work Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 font-sans transition-colors duration-200 antialiased flex flex-col">

    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-600 text-white rounded-xl shadow-md shadow-blue-500/20">
                    <i data-lucide="kanban" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Nexthink Task Monitoring</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Weekly IT Action Items & Operational Dashboard</p>
                </div>
            </div>
            <div class="flex items-center gap-2 sm:gap-3">
                <button id="resetDataBtn" onclick="resetToDefaults()" class="px-3 py-2 text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg transition flex items-center gap-1.5">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    <span>Reset Data</span>
                </button>
                <button onclick="openModal()" class="px-4 py-2 text-xs sm:text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-md shadow-blue-600/20 transition flex items-center gap-1.5">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>New Task</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

        <!-- STATS KPI CARDS -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Total Items</p>
                    <p id="kpiTotal" class="text-2xl font-bold text-slate-900 dark:text-white mt-1">0</p>
                </div>
                <div class="p-2.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl">
                    <i data-lucide="layers" class="w-5 h-5"></i>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-amber-600 dark:text-amber-400 uppercase tracking-wider">In Progress</p>
                    <p id="kpiInProgress" class="text-2xl font-bold text-amber-600 dark:text-amber-400 mt-1">0</p>
                </div>
                <div class="p-2.5 bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 rounded-xl">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider">Completed</p>
                    <p id="kpiCompleted" class="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">0</p>
                </div>
                <div class="p-2.5 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 rounded-xl">
                    <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-blue-600 dark:text-blue-400 uppercase tracking-wider">Completion Rate</p>
                    <p id="kpiRate" class="text-2xl font-bold text-blue-600 dark:text-blue-400 mt-1">0%</p>
                </div>
                <div class="p-2.5 bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 rounded-xl">
                    <i data-lucide="trending-up" class="w-5 h-5"></i>
                </div>
            </div>
        </div>

        <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider">Weekly Completion Progress</span>
                <span id="progressText" class="text-xs font-bold text-blue-600 dark:text-blue-400">0%</span>
            </div>
            <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-2.5 overflow-hidden">
                <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>
        </div>

        <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
            
            <!-- View Switcher Tabs -->
            <div class="inline-flex p-1 bg-slate-100 dark:bg-slate-700/60 rounded-lg text-xs font-medium self-start md:self-auto">
                <button id="viewKanbanBtn" onclick="switchView('kanban')" class="px-3 py-1.5 rounded-md flex items-center gap-1.5 transition bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm">
                    <i data-lucide="kanban" class="w-4 h-4"></i>
                    <span>Kanban Board</span>
                </button>
                <button id="viewListBtn" onclick="switchView('list')" class="px-3 py-1.5 rounded-md flex items-center gap-1.5 transition text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                    <i data-lucide="list" class="w-4 h-4"></i>
                    <span>List View</span>
                </button>
            </div>

            <!-- Filters & Search -->
            <div class="flex flex-wrap md:flex-nowrap gap-2 items-center flex-1 md:max-w-xl">
                <!-- Search Box -->
                <div class="relative flex-1 min-w-[180px]">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderApp()" placeholder="Search action items..." class="w-full pl-9 pr-3 py-1.5 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100">
                </div>

                <!-- Priority Filter -->
                <select id="priorityFilter" onchange="renderApp()" class="py-1.5 px-3 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100">
                    <option value="all" selected>All Priorities</option>
                    <option value="High">High Priority</option>
                    <option value="Medium">Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>

                <!-- Status Filter -->
                <select id="statusFilter" onchange="renderApp()" class="py-1.5 px-3 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100">
                    <option value="all" selected>All Statuses</option>
                    <option value="todo">To Do</option>
                    <option value="in_progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
        </div>

        <div id="kanbanView" class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
            <!-- TO DO COLUMN -->
            <div class="bg-slate-100/70 dark:bg-slate-800/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700/80 flex flex-col gap-3 min-h-[400px]">
                <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-700">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                        <h3 class="font-bold text-sm text-slate-700 dark:text-slate-200">To Do</h3>
                    </div>
                    <span id="countTodo" class="text-xs font-bold px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300">0</span>
                </div>
                <div id="colTodo" class="flex flex-col gap-3 min-h-[320px]"></div>
            </div>

            <!-- IN PROGRESS COLUMN -->
            <div class="bg-amber-50/40 dark:bg-slate-800/50 p-4 rounded-xl border border-amber-200/60 dark:border-slate-700/80 flex flex-col gap-3 min-h-[400px]">
                <div class="flex items-center justify-between pb-2 border-b border-amber-200/60 dark:border-slate-700">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                        <h3 class="font-bold text-sm text-amber-900 dark:text-amber-200">In Progress</h3>
                    </div>
                    <span id="countInProgress" class="text-xs font-bold px-2 py-0.5 rounded-full bg-amber-200 dark:bg-amber-950 text-amber-800 dark:text-amber-300">0</span>
                </div>
                <div id="colInProgress" class="flex flex-col gap-3 min-h-[320px]"></div>
            </div>

            <!-- COMPLETED COLUMN -->
            <div class="bg-emerald-50/40 dark:bg-slate-800/50 p-4 rounded-xl border border-emerald-200/60 dark:border-slate-700/80 flex flex-col gap-3 min-h-[400px]">
                <div class="flex items-center justify-between pb-2 border-b border-emerald-200/60 dark:border-slate-700">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        <h3 class="font-bold text-sm text-emerald-900 dark:text-emerald-200">Completed</h3>
                    </div>
                    <span id="countCompleted" class="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-200 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300">0</span>
                </div>
                <div id="colCompleted" class="flex flex-col gap-3 min-h-[320px]"></div>
            </div>
        </div>

        <div id="listView" class="hidden bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 dark:bg-slate-900/60 text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider border-b border-slate-200 dark:border-slate-700">
                        <tr>
                            <th class="py-3 px-4">Task Description</th>
                            <th class="py-3 px-4">Category</th>
                            <th class="py-3 px-4">Priority</th>
                            <th class="py-3 px-4">Target Day</th>
                            <th class="py-3 px-4">Status</th>
                            <th class="py-3 px-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="listTableBody" class="divide-y divide-slate-200 dark:divide-slate-700">
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <div id="taskModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl max-w-lg w-full overflow-hidden transform transition-all">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-900 dark:text-white">New Action Item</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="taskForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="taskId">
                
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Task Title / Action Item</label>
                    <input type="text" id="taskTitle" required placeholder="e.g. Upgrade Azure AD Sync Tool" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Category</label>
                        <input type="text" id="taskCategory" placeholder="e.g. Integration / Azure AD" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Target Day</label>
                        <input type="text" id="taskTargetDay" placeholder="e.g. Mon / Tue" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100 text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Priority</label>
                        <select id="taskPriority" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100 text-sm">
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 dark:text-slate-400 mb-1">Status</label>
                        <select id="taskStatus" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100 text-sm">
                            <option value="todo">To Do</option>
                            <option value="in_progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-md transition">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Default seed data array requested by user
        const DEFAULT_TASKS = [
            {
                id: "task-1",
                title: "Azure role assigning for teams integration",
                priority: "High",
                category: "Integration / Azure AD",
                status: "todo",
                targetDay: "Mon / Tue"
            },
            {
                id: "task-2",
                title: "Power Bi connect with Saikiran",
                priority: "Medium",
                category: "Analytics / Reporting",
                status: "todo",
                targetDay: "Thursday"
            },
            {
                id: "task-3",
                title: "Create alerts and make the VIP list ready",
                priority: "High",
                category: "Endpoint / Monitoring",
                status: "in_progress",
                targetDay: "Wednesday"
            },
            {
                id: "task-4",
                title: "Chrome memory saver followup",
                priority: "Low",
                category: "Endpoint / GPO",
                status: "todo",
                targetDay: "Friday"
            },
            {
                id: "task-5",
                title: "Geofencing modification and drop a mail",
                priority: "Medium",
                category: "Network / Security",
                status: "in_progress",
                targetDay: "Wednesday"
            },
            {
                id: "task-6",
                title: "Send Report with Netskope team",
                priority: "Medium",
                category: "Network / Diagnostics",
                status: "todo",
                targetDay: "Thursday"
            },
            {
                id: "task-7",
                title: "Create a SCCM monitoring dashboard for SCCM team and send the mail",
                priority: "High",
                category: "System Admin / Reporting",
                status: "todo",
                targetDay: "Tuesday"
            }
        ];

        let tasks = [];
        let currentView = 'kanban';

        // Initialize state on load
        function initApp() {
            const stored = localStorage.getItem('weekly_tasks');
            if (!stored) {
                tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
                saveTasks();
            } else {
                try {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        tasks = parsed;
                    } else {
                        tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
                        saveTasks();
                    }
                } catch (e) {
                    tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
                    saveTasks();
                }
            }
            renderApp();
        }

        function saveTasks() {
            localStorage.setItem('weekly_tasks', JSON.stringify(tasks));
        }

        function resetToDefaults() {
            tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
            saveTasks();
            document.getElementById('searchInput').value = '';
            document.getElementById('priorityFilter').value = 'all';
            document.getElementById('statusFilter').value = 'all';
            renderApp();
        }

        // VIEW SWITCHING
        function switchView(view) {
            currentView = view;
            const kBtn = document.getElementById('viewKanbanBtn');
            const lBtn = document.getElementById('viewListBtn');
            const kView = document.getElementById('kanbanView');
            const lView = document.getElementById('listView');

            if (view === 'kanban') {
                kView.classList.remove('hidden');
                lView.classList.add('hidden');
                
                kBtn.className = "px-3 py-1.5 rounded-md flex items-center gap-1.5 transition bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm";
                lBtn.className = "px-3 py-1.5 rounded-md flex items-center gap-1.5 transition text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
            } else {
                kView.classList.add('hidden');
                lView.classList.remove('hidden');

                lBtn.className = "px-3 py-1.5 rounded-md flex items-center gap-1.5 transition bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm";
                kBtn.className = "px-3 py-1.5 rounded-md flex items-center gap-1.5 transition text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
            }
            renderApp();
        }

        // RENDERING PIPELINE
        function getFilteredTasks() {
            const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            const priority = document.getElementById('priorityFilter').value;
            const status = document.getElementById('statusFilter').value;

            return tasks.filter(t => {
                const matchesSearch = !search || 
                    t.title.toLowerCase().includes(search) || 
                    (t.category && t.category.toLowerCase().includes(search));
                
                const matchesPriority = priority === 'all' || t.priority === priority;
                const matchesStatus = status === 'all' || t.status === status;

                return matchesSearch && matchesPriority && matchesStatus;
            });
        }

        function renderApp() {
            const filtered = getFilteredTasks();

            // Update Statistics KPI
            const total = tasks.length;
            const inProgress = tasks.filter(t => t.status === 'in_progress').length;
            const completed = tasks.filter(t => t.status === 'completed').length;
            const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('kpiTotal').innerText = total;
            document.getElementById('kpiInProgress').innerText = inProgress;
            document.getElementById('kpiCompleted').innerText = completed;
            document.getElementById('kpiRate').innerText = `${rate}%`;
            document.getElementById('progressText').innerText = `${rate}%`;
            document.getElementById('progressBar').style.width = `${rate}%`;

            if (currentView === 'kanban') {
                renderKanban(filtered);
            } else {
                renderList(filtered);
            }

            // Refresh icons dynamically
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        function renderKanban(filteredTasks) {
            const todoContainer = document.getElementById('colTodo');
            const inProgressContainer = document.getElementById('colInProgress');
            const completedContainer = document.getElementById('colCompleted');

            todoContainer.innerHTML = '';
            inProgressContainer.innerHTML = '';
            completedContainer.innerHTML = '';

            const todoList = filteredTasks.filter(t => t.status === 'todo');
            const inProgressList = filteredTasks.filter(t => t.status === 'in_progress');
            const completedList = filteredTasks.filter(t => t.status === 'completed');

            document.getElementById('countTodo').innerText = todoList.length;
            document.getElementById('countInProgress').innerText = inProgressList.length;
            document.getElementById('countCompleted').innerText = completedList.length;

            todoList.forEach(task => todoContainer.appendChild(createKanbanCard(task)));
            inProgressList.forEach(task => inProgressContainer.appendChild(createKanbanCard(task)));
            completedList.forEach(task => completedContainer.appendChild(createKanbanCard(task)));
        }

        function createKanbanCard(task) {
            const card = document.createElement('div');
            card.className = "bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition flex flex-col justify-between gap-3 group";

            const priorityBadge = getPriorityBadgeHtml(task.priority);

            card.innerHTML = `
                <div class="flex flex-col gap-2">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 truncate max-w-[150px]">
                            ${escapeHtml(task.category || 'General')}
                        </span>
                        ${priorityBadge}
                    </div>
                    <h4 class="font-semibold text-sm text-slate-800 dark:text-slate-100 leading-snug">
                        ${escapeHtml(task.title)}
                    </h4>
                </div>

                <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700/60 text-xs text-slate-500 dark:text-slate-400">
                    <div class="flex items-center gap-1 font-medium text-slate-500">
                        <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                        <span>${escapeHtml(task.targetDay || 'This Week')}</span>
                    </div>

                    <div class="flex items-center gap-1">
                        ${task.status !== 'todo' ? `
                            <button onclick="updateTaskStatus('${task.id}', getPrevStatus('${task.status}'))" title="Move Back" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded text-slate-500 hover:text-slate-800 dark:hover:text-white transition">
                                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                            </button>
                        ` : ''}

                        ${task.status !== 'completed' ? `
                            <button onclick="updateTaskStatus('${task.id}', getNextStatus('${task.status}'))" title="Move Forward" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded text-slate-500 hover:text-slate-800 dark:hover:text-white transition">
                                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                            </button>
                        ` : ''}

                        <button onclick="openModal('${task.id}')" title="Edit" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded text-slate-500 hover:text-slate-800 dark:hover:text-white transition">
                            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                        </button>

                        <button onclick="deleteTask('${task.id}')" title="Delete" class="p-1 hover:bg-red-50 dark:hover:bg-red-950/40 rounded text-red-500 hover:text-red-700 transition">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
            `;
            return card;
        }

        function renderList(filteredTasks) {
            const tbody = document.getElementById('listTableBody');
            tbody.innerHTML = '';

            if (filteredTasks.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-8 text-slate-400">No action items found matching your filters.</td>
                    </tr>
                `;
                return;
            }

            filteredTasks.forEach(task => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 dark:hover:bg-slate-700/30 transition";

                tr.innerHTML = `
                    <td class="py-3 px-4 font-semibold text-slate-800 dark:text-slate-200">
                        ${escapeHtml(task.title)}
                    </td>
                    <td class="py-3 px-4 text-xs text-slate-500 dark:text-slate-400">
                        <span class="px-2 py-1 bg-slate-100 dark:bg-slate-700 rounded-md font-medium">
                            ${escapeHtml(task.category || 'General')}
                        </span>
                    </td>
                    <td class="py-3 px-4">
                        ${getPriorityBadgeHtml(task.priority)}
                    </td>
                    <td class="py-3 px-4 text-xs font-medium text-slate-600 dark:text-slate-300">
                        ${escapeHtml(task.targetDay || '-')}
                    </td>
                    <td class="py-3 px-4">
                        <select onchange="updateTaskStatus('${task.id}', this.value)" class="text-xs py-1 px-2 border border-slate-200 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none">
                            <option value="todo" ${task.status === 'todo' ? 'selected' : ''}>To Do</option>
                            <option value="in_progress" ${task.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                            <option value="completed" ${task.status === 'completed' ? 'selected' : ''}>Completed</option>
                        </select>
                    </td>
                    <td class="py-3 px-4 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="openModal('${task.id}')" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded text-slate-500 hover:text-blue-600 transition">
                                <i data-lucide="pencil" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteTask('${task.id}')" class="p-1 hover:bg-red-50 dark:hover:bg-red-950/40 rounded text-red-500 hover:text-red-700 transition">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // HELPER UTILITIES
        function getPriorityBadgeHtml(priority) {
            if (priority === 'High') {
                return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 dark:bg-red-950/60 text-red-700 dark:text-red-400 uppercase tracking-wider">High</span>`;
            } else if (priority === 'Medium') {
                return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 uppercase tracking-wider">Medium</span>`;
            } else {
                return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 uppercase tracking-wider">Low</span>`;
            }
        }

        function getNextStatus(curr) {
            if (curr === 'todo') return 'in_progress';
            if (curr === 'in_progress') return 'completed';
            return 'completed';
        }

        function getPrevStatus(curr) {
            if (curr === 'completed') return 'in_progress';
            if (curr === 'in_progress') return 'todo';
            return 'todo';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // TASK CRUD ACTIONS
        function updateTaskStatus(id, newStatus) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.status = newStatus;
                saveTasks();
                renderApp();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderApp();
        }

        function openModal(id = null) {
            const modal = document.getElementById('taskModal');
            const modalTitle = document.getElementById('modalTitle');
            const form = document.getElementById('taskForm');

            if (id) {
                const task = tasks.find(t => t.id === id);
                if (task) {
                    modalTitle.innerText = "Edit Action Item";
                    document.getElementById('taskId').value = task.id;
                    document.getElementById('taskTitle').value = task.title;
                    document.getElementById('taskCategory').value = task.category || '';
                    document.getElementById('taskTargetDay').value = task.targetDay || '';
                    document.getElementById('taskPriority').value = task.priority;
                    document.getElementById('taskStatus').value = task.status;
                }
            } else {
                modalTitle.innerText = "New Action Item";
                form.reset();
                document.getElementById('taskId').value = '';
                document.getElementById('taskPriority').value = 'High';
                document.getElementById('taskStatus').value = 'todo';
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('taskId').value;
            const title = document.getElementById('taskTitle').value.trim();
            const category = document.getElementById('taskCategory').value.trim();
            const targetDay = document.getElementById('taskTargetDay').value.trim();
            const priority = document.getElementById('taskPriority').value;
            const status = document.getElementById('taskStatus').value;

            if (!title) return;

            if (id) {
                const task = tasks.find(t => t.id === id);
                if (task) {
                    task.title = title;
                    task.category = category;
                    task.targetDay = targetDay;
                    task.priority = priority;
                    task.status = status;
                }
            } else {
                const newTask = {
                    id: 'task-' + Date.now(),
                    title,
                    category: category || 'General',
                    targetDay: targetDay || 'This Week',
                    priority,
                    status
                };
                tasks.unshift(newTask);
            }

            saveTasks();
            closeModal();
            renderApp();
        }

        // WINDOW INITIALIZATION
        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
